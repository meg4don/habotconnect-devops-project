# =============================================================================
# .github/workflows/build-gate.yml
# Author: Jishnu Ravi | Contact: ravijishnu431@gmail.com
# Position: Junior Cloud & DevOps Engineer (GCP / Django / React) — HabotConnect
# Purpose: Fail-Closed Poka-Yoke gate. Any formatting violation or hardcoded
#          secret halts the pipeline immediately — no merge, no deploy, no
#          "hope it gets caught in review." This is the automated control
#          that would have stopped the incident described in the scenario.
# =============================================================================

name: Poka-Yoke Fail-Closed Build Gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "staging"]

# Default posture: nothing gets a passing status unless every gate passes.
# There is no "continue-on-error" anywhere in this file — that is intentional.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # GATE 1: Formatting / Linting — Poka-Yoke against sloppy, inconsistent code
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tooling
        run: pip install black==24.4.2 flake8==7.0.0

      - name: Run Black (formatting check — fails on any diff)
        run: black --check --diff . --exclude "venv|\.venv"

      - name: Run Flake8 (style/lint check)
        run: flake8 . --max-line-length=100 --statistics --exclude=venv,.venv,_pycache_

  # ---------------------------------------------------------------------------
  # GATE 2: Secret Scanning — Poka-Yoke against exactly what caused the incident
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Hardcoded Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so secrets can't hide in old commits

      - name: Run Gitleaks (secret detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
        # gitleaks-action exits non-zero on any detected secret by default —
        # that non-zero exit is what fails this job. No custom suppression.

      - name: Custom regex sweep for known credential shapes
        run: |
          set -e
          echo "Scanning for raw API key / token patterns..."
          if grep -RniE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            -E "(AIza[0-9A-Za-z_\-]{35}|sk_live_[0-9a-zA-Z]{24,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----)" \
            . ; then
            echo "::error::Hardcoded credential pattern detected. Build quarantined."
            exit 1
          fi
          echo "No raw credential patterns found."

  # ---------------------------------------------------------------------------
  # GATE 3: Quarantine — runs ONLY if either gate above failed
  # ---------------------------------------------------------------------------
  quarantine:
    name: Quarantine Failed Build
    runs-on: ubuntu-latest
    needs: [lint, secret-scan]
    if: failure()
    steps:
      - name: Mark build as quarantined
        run: |
          echo "::error::BUILD QUARANTINED — Fail-Closed gate triggered."
          echo "This build did not meet formatting or security requirements"
          echo "and has been blocked from proceeding to staging deployment."
          exit 1

  # ---------------------------------------------------------------------------
  # GATE 4 (only runs if everything above passed): deploy eligibility marker
  # ---------------------------------------------------------------------------
  gate-passed:
    name: Fail-Closed Gate Passed
    runs-on: ubuntu-latest
    needs: [lint, secret-scan]
    if: success()
    steps:
      - name: Confirm clean build
        run: echo "All Poka-Yoke gates passed. Build is eligible for staging deployment."
